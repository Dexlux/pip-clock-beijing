<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>北京时间 · PiP 悬浮时钟</title>
<style>
  :root {
    --bg: #05070a;
    --time: #f0f6fc;
    --sub: #8b949e;
    --accent: #2f81f7;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--time);
    font-family: -apple-system, "SF Pro Display", "PingFang SC", monospace;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; height: 100vh; overflow: hidden;
  }
  #wrap {
    position: relative; width: min(900px, 94vw);
    border-radius: 24px; overflow: hidden;
    border: 1px solid rgba(255,255,255,.08);
    background: #000; box-shadow: 0 40px 80px rgba(0,0,0,.8);
  }
  video { display: block; width: 100%; height: auto; }
  .controls {
    margin-top: 20px; display: flex; gap: 12px;
  }
  button {
    background: var(--accent); color: #fff; border: none; border-radius: 12px;
    padding: 14px 32px; font-size: 16px; font-weight: 600; cursor: pointer;
    transition: filter .15s, transform .05s;
  }
  button:hover { filter: brightness(1.15); }
  button:active { transform: scale(.97); }
  button.secondary { background: #161b22; border: 1px solid #30363d; }
  .status {
    margin-top: 12px; font-size: 13px; color: var(--sub);
    text-align: center;
  }
</style>
</head>
<body>
  <div id="wrap"><video id="v" autoplay muted playsinline></video></div>
  <div class="controls">
    <button id="pipBtn">🖥️ 进入小窗</button>
    <button id="syncBtn" class="secondary">🔄 对时</button>
  </div>
  <div class="status" id="status">正在对时…</div>

<canvas id="c" width="900" height="500" style="display:none"></canvas>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const video = document.getElementById('v');
  const pipBtn = document.getElementById('pipBtn');
  const syncBtn = document.getElementById('syncBtn');
  const status = document.getElementById('status');

  // 粒子背景类
  class Particle {
    constructor(W, H) { this.W = W; this.H = H; this.reset(); }
    reset() {
      this.x = Math.random() * this.W;
      this.y = Math.random() * this.H;
      this.vx = (Math.random() - 0.5) * 0.3;
      this.vy = (Math.random() - 0.5) * 0.3;
      this.r = Math.random() * 1.5 + 0.5;
      this.alpha = Math.random() * 0.4 + 0.1;
    }
    update() {
      this.x += this.vx; this.y += this.vy;
      if (this.x < 0 || this.x > this.W || this.y < 0 || this.y > this.H) this.reset();
    }
    draw(ctx) {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(47,129,247,${this.alpha})`;
      ctx.fill();
    }
  }

  const particles = [];
  for (let i = 0; i < 80; i++) particles.push(new Particle(900, 500));

  // 时间引擎
  let offsetMs = 0, calibrated = false, lastRtt = 0;
  const nowCST = () => new Date(Date.now() + offsetMs);

  // 多源对时(淘宝/苏宁/worldtimeapi/timeapi)
  const SOURCES = [
    { url: 'https://api.m.taobao.com/rest/api3.do?api=mtop.common.getTimestamp', parse: j => j?.data?.t },
    { url: 'https://quan.suning.com/getSysTime.do', parse: j => j?.sysTime1 ? Date.parse(j.sysTime1.replace(/^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})$/, '$1-$2-$3T$4:$5:$6+08:00')) : NaN },
    { url: 'https://worldtimeapi.org/api/timezone/Asia/Shanghai', parse: j => j?.unixtime * 1000 },
    { url: 'https://timeapi.io/api/Time/current/zone?timeZone=Asia/Shanghai', parse: j => Number.isFinite(j?.milliseconds) ? Date.UTC(j.year, j.month-1, j.day, j.hour, j.minute, j.second, j.milliseconds) : NaN }
  ];

  async function fetchTime(src) {
    const t0 = performance.now();
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 4000);
    try {
      const r = await fetch(src.url, { signal: ctrl.signal, cache: 'no-store' });
      const j = await r.json();
      const ms = src.parse(j);
      if (!Number.isFinite(ms)) throw new Error();
      return { ms, rtt: performance.now() - t0 };
    } finally { clearTimeout(timer); }
  }

  async function calibrate() {
    let best = null;
    for (const src of SOURCES) {
      try {
        for (let i = 0; i < 3; i++) {
          const m = await fetchTime(src);
          if (!best || m.rtt < best.rtt) best = { ...m, source: src.url.split('/')[2] };
        }
      } catch { continue; }
      if (best) break;
    }
    if (best) {
      offsetMs = Math.round(best.ms + best.rtt / 2 - Date.now());
      calibrated = true; lastRtt = Math.round(best.rtt);
      status.innerHTML = `✅ 已对时: <b>${best.source}</b> RTT=${lastRtt}ms 偏移=${offsetMs>=0?'+':''}${offsetMs}ms`;
    } else {
      calibrated = false; offsetMs = 0;
      status.innerHTML = '⚠️ 本地时间(设备可能不准)';
    }
  }

  // 绘制时钟
  function draw() {
    const W = 900, H = 500;
    const p = nowCST();
    const fmt = new Intl.DateTimeFormat('zh-CN', {
      timeZone: 'Asia/Shanghai', hour12: false,
      hour: '2-digit', minute: '2-digit', second: '2-digit',
      year: 'numeric', month: '2-digit', day: '2-digit', weekday: 'short'
    }).formatToParts(p);

    const parts = {};
    for (const x of fmt) parts[x.type] = x.value;

    // 背景
    ctx.fillStyle = '#05070a';
    ctx.fillRect(0, 0, W, H);

    // 粒子
    particles.forEach(p => { p.update(); p.draw(ctx); });

    // 连线
    for (let i = 0; i < particles.length; i++) {
      for (let j = i + 1; j < particles.length; j++) {
        const dx = particles[i].x - particles[j].x;
        const dy = particles[i].y - particles[j].y;
        const d = Math.sqrt(dx*dx + dy*dy);
        if (d < 80) {
          ctx.beginPath();
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(particles[j].x, particles[j].y);
          ctx.strokeStyle = `rgba(47,129,247,${0.1 * (1 - d/80)})`;
          ctx.stroke();
        }
      }
    }

    // 日期
    ctx.textAlign = 'center';
    ctx.fillStyle = '#8b949e';
    ctx.font = '400 24px -apple-system, sans-serif';
    ctx.fillText(`${parts.year}-${parts.month}-${parts.day} ${parts.weekday}`, W/2, 120);

    // 时间(含毫秒)
    const timeStr = `${parts.hour}:${parts.minute}:${parts.second}`;
    ctx.fillStyle = '#f0f6fc';
    ctx.font = '700 140px -apple-system, "SF Pro Display", sans-serif';
    ctx.fillText(timeStr, W/2, 290);

    // 毫秒
    const ms = p.getUTCMilliseconds();
    ctx.fillStyle = '#2f81f7';
    ctx.font = '500 48px -apple-system, monospace';
    ctx.fillText(`.${String(ms).padStart(3, '0')}`, W/2 + 180, 290);

    // 校准状态
    ctx.font = '400 18px -apple-system, sans-serif';
    ctx.textAlign = calibrated ? 'right' : 'left';
    ctx.fillStyle = calibrated ? '#3fb950' : '#f85149';
    ctx.fillText(calibrated ? '✅ 网络对时' : '⚠️ 本地时间', calibrated ? W - 40 : 40, 60);
  }

  // 流 + PiP
  video.srcObject = canvas.captureStream(10);
  video.play().catch(() => {});

  const pipSupported = 'pictureInPictureEnabled' in document && document.pictureInPictureEnabled;
  pipBtn.addEventListener('click', () => {
    if (document.pictureInPictureElement) return document.exitPictureInPicture();
    ('requestPictureInPicture' in video) ? video.requestPictureInPicture()
      : ('webkitSetPresentationMode' in video) ? video.webkitSetPresentationMode('picture-in-picture')
      : status.innerHTML = '⚠️ 浏览器不支持 PiP';
  });

  syncBtn.addEventListener('click', calibrate);
  video.addEventListener('enterpictureinpicture', () => status.innerHTML = '📌 已小窗!');
  video.addEventListener('leavepictureinpicture', () => status.innerHTML = '已退出小窗');

  async function init() {
    await calibrate();
    setInterval(calibrate, 5 * 60 * 1000);
    setInterval(draw, 50);
    draw();
  }
  init();
})();
</script>
</body>
</html>
