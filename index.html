<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>北京时间 · PiP 悬浮时钟</title>
<style>
  :root {
    --bg: #05070a;
    --time: #f0f6fc;
    --sub: #8b949e;
    --accent: #2f81f7;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--time);
    font-family: -apple-system, "SF Pro Display", "PingFang SC", monospace;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; height: 100vh; overflow: hidden;
  }
  #wrap {
    position: relative; width: min(900px, 94vw);
    border-radius: 24px; overflow: hidden;
    border: 1px solid rgba(255,255,255,.08);
    background: #000; box-shadow: 0 40px 80px rgba(0,0,0,.8);
  }
  video { display: block; width: 100%; height: auto; }
  .controls {
    margin-top: 20px; display: flex; gap: 12px;
  }
  button {
    background: var(--accent); color: #fff; border: none; border-radius: 12px;
    padding: 14px 32px; font-size: 16px; font-weight: 600; cursor: pointer;
    transition: filter .15s, transform .05s;
  }
  button:hover { filter: brightness(1.15); }
  button:active { transform: scale(.97); }
  button.secondary { background: #161b22; border: 1px solid #30363d; }
  .status {
    margin-top: 12px; font-size: 13px; color: var(--sub);
    text-align: center;
  }
</style>
</head>
<body>
  <div id="wrap"><video id="v" autoplay muted playsinline></video></div>
  <div class="controls">
    <button id="pipBtn">🖥️ 进入小窗</button>
    <button id="syncBtn" class="secondary">🔄 对时</button>
  </div>
  <div class="status" id="status">正在对时…</div>

<canvas id="c" width="900" height="250" style="display:none"></canvas>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const video = document.getElementById('v');
  const pipBtn = document.getElementById('pipBtn');
  const syncBtn = document.getElementById('syncBtn');
  const status = document.getElementById('status');

  // 粒子背景类
  class Particle {
    constructor(W, H) { this.W = W; this.H = H; this.reset(); }
    reset() {
      this.x = Math.random() * this.W;
      this.y = Math.random() * this.H;
      this.vx = (Math.random() - 0.5) * 0.3;
      this.vy = (Math.random() - 0.5) * 0.3;
      this.r = Math.random() * 1.5 + 0.5;
      this.alpha = Math.random() * 0.4 + 0.1;
    }
    update() {
      this.x += this.vx; this.y += this.vy;
      if (this.x < 0 || this.x > this.W || this.y < 0 || this.y > this.H) this.reset();
    }
    draw(ctx) {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(47,129,247,${this.alpha})`;
      ctx.fill();
    }
  }

  const particles = [];
  for (let i = 0; i < 80; i++) particles.push(new Particle(900, 250));

  // 时间引擎
  let offsetMs = 0, calibrated = false, lastRtt = 0, calibrating = false;
  let retryTimer = null, failCount = 0;
  const RETRY_MS = 10000; // 失败后 10 秒自动重试
  const nowCST = () => new Date(Date.now() + offsetMs);

  // JSONP 加载器(绕过 CORS,腾讯接口是 JSONP 格式)
  function jsonp(url, timeout = 3000) {
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      const timer = setTimeout(() => { s.remove(); reject(new Error('timeout')); }, timeout);
      s.onload = () => {
        clearTimeout(timer);
        const v = window.QZOutputJson;
        window.QZOutputJson = undefined;
        s.remove();
        v ? resolve(v) : reject(new Error('no data'));
      };
      s.onerror = () => { clearTimeout(timer); s.remove(); reject(new Error('load error')); };
      s.src = url;
      document.head.appendChild(s);
    });
  }

  // 对时源(全部经 curl 实测:CORS 可用或 JSONP 可绕)
  const SOURCES = [
    { name: '苏宁', url: 'https://quan.suning.com/getSysTime.do', parse: (raw) => {
        try {
          const j = JSON.parse(raw);
          const s = String(j.sysTime1 || '');
          return s.length === 14 ? Date.parse(s.replace(/^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})$/, '$1-$2-$3T$4:$5:$6+08:00')) : NaN;
        } catch { return NaN; }
      } },
    { name: 'timeapi.io', url: 'https://timeapi.io/api/Time/current/zone?timeZone=Asia/Shanghai', parse: (raw) => {
        try {
          const j = JSON.parse(raw);
          return Number.isFinite(j.milliSeconds) ? Date.UTC(j.year, j.month-1, j.day, j.hour, j.minute, j.seconds, j.milliSeconds) : NaN;
        } catch { return NaN; }
      } },
    { name: 'Cloudflare', url: 'https://www.cloudflare.com/cdn-cgi/trace', parse: (raw) => {
        const m = String(raw).match(/\bts=(\d+(?:\.\d+)?)/);
        return m ? Math.round(Number(m[1]) * 1000) : NaN;
      } },
    { name: '1.1.1.1', url: 'https://one.one.one.one/cdn-cgi/trace', parse: (raw) => {
        const m = String(raw).match(/\bts=(\d+(?:\.\d+)?)/);
        return m ? Math.round(Number(m[1]) * 1000) : NaN;
      } },
    { name: '腾讯', kind: 'jsonp', url: 'https://vv.video.qq.com/checktime?otype=json', parse: (j) => {
        return j && j.t ? Number(j.t) * 1000 : NaN;
      } }
  ];

  // 单次探测(3 秒超时)
  async function probe(src) {
    const t0 = performance.now();
    try {
      let ms;
      if (src.kind === 'jsonp') {
        const v = await jsonp(src.url);
        ms = src.parse(v);
      } else {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 3000);
        try {
          const r = await fetch(src.url, { signal: ctrl.signal, cache: 'no-store' });
          const raw = await r.text();
          ms = src.parse(raw);
        } finally { clearTimeout(timer); }
      }
      if (!Number.isFinite(ms) || ms < 1e12) return null;
      return { ms, rtt: performance.now() - t0, source: src.name };
    } catch { return null; }
  }

  // 并行探测所有源(每源 2 次,取 RTT 最小),10 秒内出结果
  async function calibrate() {
    if (calibrating) return;
    calibrating = true;
    if (retryTimer) { clearTimeout(retryTimer); retryTimer = null; }
    const attempts = [];
    for (const src of SOURCES) attempts.push(probe(src), probe(src));
    const results = (await Promise.all(attempts)).filter(Boolean);
    calibrating = false;
    if (results.length) {
      const best = results.sort((a, b) => a.rtt - b.rtt)[0];
      offsetMs = Math.round(best.ms + best.rtt / 2 - Date.now());
      calibrated = true; lastRtt = Math.round(best.rtt); failCount = 0;
      status.innerHTML = `✅ 已对时: <b>${best.source}</b> RTT=${lastRtt}ms 偏移=${offsetMs>=0?'+':''}${offsetMs}ms`;
    } else {
      calibrated = false; failCount++;
      // 失败不重置 offsetMs → 自动沿用上次成功校准值(设备时钟几分钟内漂移可忽略)
      const hint = offsetMs !== 0 ? '沿用上次校准值' : '显示本地时间';
      status.innerHTML = `⚠️ 对时失败(第${failCount}次),${hint},${RETRY_MS/1000}秒后自动重试…`;
      retryTimer = setTimeout(calibrate, RETRY_MS);
    }
  }

  // 北京时间格式化器(缓存,避免每帧重建)
  const FMT = new Intl.DateTimeFormat('zh-CN', {
    timeZone: 'Asia/Shanghai', hour12: false,
    hour: '2-digit', minute: '2-digit', second: '2-digit',
    year: 'numeric', month: '2-digit', day: '2-digit', weekday: 'short'
  });

  // 绘制时钟
  function draw() {
    const W = 900, H = 250;
    const p = nowCST();
    const parts = {};
    for (const x of FMT.formatToParts(p)) parts[x.type] = x.value;

    // 背景
    ctx.fillStyle = '#05070a';
    ctx.fillRect(0, 0, W, H);

    // 粒子
    particles.forEach(p => { p.update(); p.draw(ctx); });

    // 连线
    for (let i = 0; i < particles.length; i++) {
      for (let j = i + 1; j < particles.length; j++) {
        const dx = particles[i].x - particles[j].x;
        const dy = particles[i].y - particles[j].y;
        const d = Math.sqrt(dx*dx + dy*dy);
        if (d < 80) {
          ctx.beginPath();
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(particles[j].x, particles[j].y);
          ctx.strokeStyle = `rgba(47,129,247,${0.1 * (1 - d/80)})`;
          ctx.stroke();
        }
      }
    }

    // 时间(时分秒.毫秒 统一样式,等宽字体防晃动)
    const ms = String(p.getUTCMilliseconds()).padStart(3, '0');
    const timeStr = `${parts.hour}:${parts.minute}:${parts.second}.${ms}`;
    ctx.textAlign = 'center';
    ctx.fillStyle = '#f0f6fc';
    ctx.font = '700 110px ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace';
    ctx.fillText(timeStr, W / 2, 172);

    // 日期
    ctx.textAlign = 'center';
    ctx.fillStyle = '#8b949e';
    ctx.font = '400 22px -apple-system, sans-serif';
    ctx.fillText(`${parts.year}-${parts.month}-${parts.day} ${parts.weekday}`, W/2, 42);

    // 校准状态角标(右上)
    ctx.font = '400 17px -apple-system, sans-serif';
    ctx.textAlign = 'right';
    if (calibrated) {
      ctx.fillStyle = '#3fb950';
      ctx.fillText('✓ 已对时', W - 36, 42);
    } else if (offsetMs !== 0) {
      ctx.fillStyle = '#d29922';
      ctx.fillText('⏳ 沿用上次校准', W - 36, 42);
    } else {
      ctx.fillStyle = '#f85149';
      ctx.fillText('⚠ 本地时间', W - 36, 42);
    }
  }

  // 流 + PiP
  video.srcObject = canvas.captureStream(30); // 30fps 视频流,毫秒更新顺滑
  video.play().catch(() => {});

  const pipSupported = 'pictureInPictureEnabled' in document && document.pictureInPictureEnabled;
  pipBtn.addEventListener('click', () => {
    if (document.pictureInPictureElement) return document.exitPictureInPicture();
    ('requestPictureInPicture' in video) ? video.requestPictureInPicture()
      : ('webkitSetPresentationMode' in video) ? video.webkitSetPresentationMode('picture-in-picture')
      : status.innerHTML = '⚠️ 浏览器不支持 PiP';
  });

  syncBtn.addEventListener('click', calibrate);
  video.addEventListener('enterpictureinpicture', () => status.innerHTML = '📌 已小窗!');
  video.addEventListener('leavepictureinpicture', () => status.innerHTML = '已退出小窗');

  async function init() {
    await calibrate();
    setInterval(calibrate, 5 * 60 * 1000);
    // 前台:requestAnimationFrame 逐帧重绘(60fps 丝滑);后台:setInterval 兜底保秒
    setInterval(() => { if (document.hidden) draw(); }, 100);
    (function loop() { draw(); requestAnimationFrame(loop); })();
  }
  init();
})();
</script>
</body>
</html>
