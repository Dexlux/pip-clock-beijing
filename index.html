<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>北京时间 · PiP 悬浮时钟</title>
<style>
  :root {
    --bg: #05070a;
    --time: #f0f6fc;
    --sub: #8b949e;
    --accent: #2f81f7;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--time);
    font-family: -apple-system, "SF Pro Display", "PingFang SC", monospace;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; height: 100vh; overflow: hidden;
  }
  #wrap {
    position: relative; width: min(900px, 94vw);
    border-radius: 24px; overflow: hidden;
    border: 1px solid rgba(255,255,255,.08);
    background: #000; box-shadow: 0 40px 80px rgba(0,0,0,.8);
  }
  video { display: block; width: 100%; height: auto; }
  .controls {
    margin-top: 20px; display: flex; gap: 12px;
  }
  button {
    background: var(--accent); color: #fff; border: none; border-radius: 12px;
    padding: 14px 32px; font-size: 16px; font-weight: 600; cursor: pointer;
    transition: filter .15s, transform .05s;
  }
  button:hover { filter: brightness(1.15); }
  button:active { transform: scale(.97); }
  button.secondary { background: #161b22; border: 1px solid #30363d; }
  .status {
    margin-top: 12px; font-size: 13px; color: var(--sub);
    text-align: center;
  }
</style>
</head>
<body>
  <div id="wrap"><video id="v" autoplay muted playsinline></video></div>
  <div class="controls">
    <button id="pipBtn">🖥️ 进入小窗</button>
    <button id="syncBtn" class="secondary">🔄 对时</button>
  </div>
  <div class="status" id="status">正在对时…</div>

<canvas id="c" width="900" height="250" style="display:none"></canvas>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const video = document.getElementById('v');
  const pipBtn = document.getElementById('pipBtn');
  const syncBtn = document.getElementById('syncBtn');
  const status = document.getElementById('status');

  // 粒子背景类
  class Particle {
    constructor(W, H) { this.W = W; this.H = H; this.reset(); }
    reset() {
      this.x = Math.random() * this.W;
      this.y = Math.random() * this.H;
      this.vx = (Math.random() - 0.5) * 0.3;
      this.vy = (Math.random() - 0.5) * 0.3;
      this.r = Math.random() * 1.5 + 0.5;
      this.alpha = Math.random() * 0.4 + 0.1;
    }
    update() {
      this.x += this.vx; this.y += this.vy;
      if (this.x < 0 || this.x > this.W || this.y < 0 || this.y > this.H) this.reset();
    }
    draw(ctx) {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(47,129,247,${this.alpha})`;
      ctx.fill();
    }
  }

  const particles = [];
  for (let i = 0; i < 80; i++) particles.push(new Particle(900, 250));

  // ===== 时间引擎 =====
  // 单调锚点模型:避免 Date.now() 整数毛刺,也避免系统 NTP 校时让画面跳一下
  let anchor = { epoch: Date.now(), perf: performance.now() };
  const nowMs = () => anchor.epoch + (performance.now() - anchor.perf);

  let offsetMs = 0, uncMs = Infinity, calibrated = false, quality = 'none';
  let lastSource = '—', lastSamplesCount = 0, lastRtt = 0;
  let calibrating = false, retryTimer = null, failCount = 0;
  let lastCalAt = 0, lastHealAt = 0, drawCount = 0;
  const RETRY_MS = 10000;            // 全部源失败后 10 秒重试
  const CALIBRATE_MS = 5 * 60 * 1000; // 成功后 5 分钟再校准

  // 跨批次历史:单次校准有 ±100ms 随机误差,用逆方差加权把多次结果压平
  const HIST_N = 5;                        // 最多保留 5 次校准结果
  const HIST_MAX_AGE_MS = 20 * 60 * 1000;  // 超过 20 分钟的结果不再参与
  let hist = [];                           // [{ off, u, at }]  at = performance.now()
  let rawOffset = 0;                       // 最近一次未合并的 nextOffset(调试用)

  const pad2 = (n) => String(n).padStart(2, '0');
  const pad3 = (n) => String(n).padStart(3, '0');
  const median = (sorted) => {
    if (!sorted.length) return NaN;
    const m = sorted.length >> 1;
    return sorted.length % 2 ? sorted[m] : (sorted[m - 1] + sorted[m]) / 2;
  };
  // 所有请求都带随机参数:cache:'no-store' 对 <script src> 不生效,腾讯会拿到缓存里的旧时间
  const bust = (url) =>
    `${url}${url.includes('?') ? '&' : '?'}_=${Date.now()}${Math.random().toString(36).slice(2, 8)}`;

  // JSONP 加载器(绕过 CORS,腾讯接口是 JSONP 格式)
  // 带着 t4 一起 resolve:脚本执行完即取,解析开销计入 RTT(故单样本额外 +40ms 不确定度)
  function jsonp(url, timeout = 5000) {
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      const timer = setTimeout(() => { s.remove(); reject(new Error('timeout')); }, timeout);
      s.onload = () => {
        const t4 = performance.now();
        clearTimeout(timer);
        const v = window.QZOutputJson;
        window.QZOutputJson = undefined;
        s.remove();
        v ? resolve({ v, t4 }) : reject(new Error('no data'));
      };
      s.onerror = () => { clearTimeout(timer); s.remove(); reject(new Error('load error')); };
      s.src = bust(url); // JSONP 也必须防缓存,cache:'no-store' 管不到 <script src>
      document.head.appendChild(s);
    });
  }

  // trace 里 ts 是整秒(如 ts=1794364026.000),只能给 1000ms 分辨率
  function parseTrace(raw) {
    const m = String(raw).match(/\bts=(\d+(?:\.\d+)?)/);
    return m ? Number(m[1]) * 1000 : NaN;
  }

  // 对时源(实测可通);res = 自身分辨率(ms),决定单样本不确定度与选源权重
  const SOURCES = [
    { name: 'timeapi.io', kind: 'fetch', res: 1, n: 5,
      url: 'https://timeapi.io/api/Time/current/zone?timeZone=Asia/Shanghai',
      parse: (raw) => {
        try {
          const j = JSON.parse(raw);
          if (!j || !Number.isFinite(j.year)) return NaN;
          // 接口返回的是 Asia/Shanghai 墙上时间,必须按 +08:00 解释(当 UTC 会差 8 小时)
          return Date.parse(`${j.year}-${pad2(j.month)}-${pad2(j.day)}T` +
            `${pad2(j.hour)}:${pad2(j.minute)}:${pad2(j.seconds)}.${pad3(j.milliSeconds || 0)}+08:00`);
        } catch { return NaN; }
      } },
    { name: 'Cloudflare', kind: 'fetch', res: 1000, n: 3,
      url: 'https://www.cloudflare.com/cdn-cgi/trace', parse: parseTrace },
    { name: '1.1.1.1', kind: 'fetch', res: 1000, n: 3,
      url: 'https://one.one.one.one/cdn-cgi/trace', parse: parseTrace },
    { name: '腾讯', kind: 'jsonp', res: 1000, n: 3,
      url: 'https://vv.video.qq.com/checktime?otype=json',
      parse: (j) => (j && Number.isFinite(Number(j.t)) ? Number(j.t) * 1000 : NaN) }
  ];

  // 单次采样:NTP 中点估计。perf 与 epoch 两个时基必须先对齐,不能混用
  async function sample(src) {
    const perfBase = { p: performance.now(), e: Date.now() };
    const toEpoch = (p) => perfBase.e + (p - perfBase.p);
    const t1 = performance.now();
    let t4 = NaN, srv = NaN;
    try {
      if (src.kind === 'jsonp') {
        const r = await jsonp(src.url);
        t4 = r.t4;
        srv = src.parse(r.v);
      } else {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 6000);
        try {
          const r = await fetch(bust(src.url), { cache: 'no-store', signal: ctrl.signal });
          t4 = performance.now();          // 响应头一到就取,body 读取不算 RTT
          srv = src.parse(await r.text());
        } finally { clearTimeout(timer); }
      }
    } catch { return null; }
    if (!Number.isFinite(srv) || srv < 1.6e12) return null;
    const rtt = t4 - t1;
    return {
      srv, rtt,
      offset: srv - toEpoch((t1 + t4) / 2),          // 服务器时间 ≈ 本地 (t1+t4)/2 时刻
      u: src.res / 2 + rtt / 2 + (src.kind === 'jsonp' ? 40 : 0) // 单样本不确定度
    };
  }

  // 单源聚合:NTP 最小 RTT 窗口 + 中位数,不确定度还要覆盖样本极差
  function aggregate(samples, res) {
    if (!samples.length) return null;
    const minRtt = Math.min(...samples.map(s => s.rtt));
    const kept = samples.filter(s => s.rtt <= minRtt * 2 + 80);
    // 整秒源是向下截断的(offset 系统性偏小 ~500ms),加半个分辨率居中,否则会带歪跨源一致性
    const center = res > 1 ? res / 2 : 0;
    const offs = kept.map(s => s.offset + center).sort((a, b) => a - b);
    const us = kept.map(s => s.u).sort((a, b) => a - b);
    return {
      est: median(offs),
      u: Math.max(median(us), (offs[offs.length - 1] - offs[0]) / 2),
      n: kept.length,
      minRtt,
      offsets: kept.map(s => s.offset + center)
    };
  }

  // 单源顺序采样(并行会互相排队,把 RTT 打歪)
  async function collect(src) {
    const out = [];
    for (let i = 0; i < src.n; i++) {
      const s = await sample(src);
      if (s) out.push(s);
    }
    const a = aggregate(out, src.res);
    return a ? { name: src.name, res: src.res, ...a } : null;
  }

  // 精度分级:没有毫秒源时一律粗对时,整秒源绝不冒充毫秒精度
  function qualityOf(unc, hasPrecise) {
    if (!hasPrecise) return 'coarse';
    if (unc <= 120) return 'good';
    if (unc <= 600) return 'ok';
    return 'coarse';
  }
  const signed = (n) => (n >= 0 ? '+' : '') + Math.round(n);
  const setStatus = (txt) => { status.innerHTML = txt; };

  // 校准:源间并行、源内串行 → 跨源一致性 → 按不确定度加权
  async function calibrate() {
    if (calibrating) return;
    calibrating = true;
    if (retryTimer) { clearTimeout(retryTimer); retryTimer = null; }
    try {
      const per = await Promise.all(SOURCES.map(collect));
      const alive = per.filter(a => a && Number.isFinite(a.est));
      lastCalAt = performance.now();

      if (!alive.length) {
        calibrated = false; failCount++;
        // 失败不重置 offsetMs → 自动沿用上次成功校准值(设备时钟几分钟内漂移可忽略)
        const hint = offsetMs !== 0 ? '沿用上次校准值' : '显示本地时间';
        setStatus(`⚠️ 对时失败(第${failCount}次),${hint},${RETRY_MS / 1000}秒后自动重试…`);
        retryTimer = setTimeout(calibrate, RETRY_MS);
        return;
      }

      // 跨源一致性
      // 1) 大头否决:整秒源彼此一致、却和毫秒源差 >1.2s(时区错 8 小时/缓存脏值)→ 信整秒源的多数
      const precise = alive.filter(a => a.res <= 1);
      const coarse = alive.filter(a => a.res > 1);
      let pool = alive;
      if (precise.length && coarse.length >= 2) {
        const cm = median(coarse.map(a => a.est).sort((x, y) => x - y));
        const agreeCoarse = coarse.filter(a => Math.abs(a.est - cm) <= 1200);
        if (agreeCoarse.length >= 2 && agreeCoarse.every(a => Math.abs(a.est - precise[0].est) > 1200)) {
          pool = coarse; // 毫秒源被整秒源多数否决 → 降级为粗对时
        }
      }

      // 2) 共识取同分辨率层的值:毫秒源在时,不让整秒源的 ±500ms 粒度带歪中位数
      const bestRes = Math.min(...pool.map(a => a.res));
      const hasPrecise = bestRes <= 1;
      const M = median(pool.filter(a => a.res === bestRes).map(a => a.est).sort((a, b) => a - b));
      const tol = hasPrecise ? 400 : 1200; // 整秒源之间本来就可能差近 1 秒
      const good = pool.filter(a => Math.abs(a.est - M) <= tol + a.res / 2); // 按源自身分辨率留余量

      // 3) 先按分辨率、再按不确定度选源;只与同分辨率的源做 1/u² 加权,整秒源不掺和毫秒结果
      good.sort((a, b) => (a.res - b.res) || (a.u - b.u));
      const pick = good[0];
      const agree = good.filter(a => a.res === pick.res && Math.abs(a.est - pick.est) <= 200);
      let wsum = 0, acc = 0;
      for (const a of agree) {
        const w = 1 / Math.max(a.u * a.u, 1);
        wsum += w; acc += a.est * w;
      }
      const nextOffset = acc / wsum;
      const nextUnc = pick.u;

      // 跳变保护:精度不足又跳超过 2 秒,宁可丢弃这次结果,也别让画面乱跳
      if (calibrated && Math.abs(nextOffset - offsetMs) > 2000 && nextUnc > 300) {
        setStatus(`⚠️ 本次对时偏差 ${signed(nextOffset - offsetMs)}ms 过大且精度不足,已忽略,3 秒后重试…`);
        retryTimer = setTimeout(calibrate, 3000);
        return;
      }

      // 历史平滑:先按时间淘汰,再判离群,最后逆方差合并
      hist = hist.filter(h => performance.now() - h.at <= HIST_MAX_AGE_MS);
      rawOffset = nextOffset;
      if (hist.length) {
        let hw = 0, ha = 0;
        for (const h of hist) {
          const w = 1 / Math.max(h.u * h.u, 1);
          hw += w; ha += h.off * w;
        }
        const histMean = ha / hw;
        if (hist.length >= 2 && Math.abs(nextOffset - histMean) > 500 && nextUnc > 300) {
          setStatus(`⚠️ 本次对时偏离历史 ${signed(nextOffset - histMean)}ms，已忽略，3 秒后重试…`);
          retryTimer = setTimeout(calibrate, 3000);
          return;
        }
      }
      hist.push({ off: nextOffset, u: nextUnc, at: performance.now() });
      if (hist.length > HIST_N) hist.shift();

      const ws = hist.map(h => 1 / Math.max(h.u * h.u, 1));
      const iwSum = ws.reduce((a, b) => a + b, 0);
      const merged = hist.reduce((acc, h, i) => acc + h.off * ws[i], 0) / iwSum;
      const combUnc = Math.sqrt(1 / iwSum);
      // 逆方差假设各次独立,实际有共模偏差 → 下限保守取单次 u 的 55%
      const mergedUnc = Math.max(combUnc, 0.55 * nextUnc);
      const nextQuality = qualityOf(mergedUnc, pick.res <= 1);

      offsetMs = merged; uncMs = mergedUnc; quality = nextQuality;
      calibrated = true; failCount = 0;
      lastSource = pick.name;
      lastSamplesCount = alive.reduce((n, a) => n + a.n, 0);
      lastRtt = pick.minRtt;
      anchor = { epoch: offsetMs + Date.now(), perf: performance.now() }; // 成功后重设锚点

      const detail = `<b>${pick.name}</b> ±${Math.round(uncMs)}ms  RTT=${Math.round(lastRtt)}ms  偏移=${signed(offsetMs)}ms`;
      setStatus(quality === 'good' ? `✅ 已对时: ${detail}`
        : quality === 'ok' ? `🟡 已对时(精度一般): ${detail}`
        : `⚠️ 粗对时(±0.5s): ${detail}`);
    } finally {
      calibrating = false;
    }
  }

  // 北京时间格式化器(缓存,避免每帧重建)
  const FMT = new Intl.DateTimeFormat('zh-CN', {
    timeZone: 'Asia/Shanghai', hour12: false,
    hour: '2-digit', minute: '2-digit', second: '2-digit',
    year: 'numeric', month: '2-digit', day: '2-digit', weekday: 'short'
  });

  // 绘制时钟
  function draw() {
    const W = 900, H = 250;

    // 漂移自检:睡眠唤醒/系统 NTP 跳变会让锚点偏离,差 >300ms 就重设锚点并重校(≥5 秒一次)
    if (Math.abs(nowMs() - (Date.now() + offsetMs)) > 300 && performance.now() - lastHealAt > 5000) {
      lastHealAt = performance.now();
      anchor = { epoch: Date.now() + offsetMs, perf: performance.now() };
      hist = []; // 系统时钟被外部改动,旧历史作废,避免平滑把错误值拖住
      setTimeout(calibrate, 0);
    }
    drawCount++;

    const t = nowMs();
    const p = new Date(t);
    const parts = {};
    for (const x of FMT.formatToParts(p)) parts[x.type] = x.value;

    // 背景
    ctx.fillStyle = '#05070a';
    ctx.fillRect(0, 0, W, H);

    // 粒子
    particles.forEach(p => { p.update(); p.draw(ctx); });

    // 连线
    for (let i = 0; i < particles.length; i++) {
      for (let j = i + 1; j < particles.length; j++) {
        const dx = particles[i].x - particles[j].x;
        const dy = particles[i].y - particles[j].y;
        const d = Math.sqrt(dx*dx + dy*dy);
        if (d < 80) {
          ctx.beginPath();
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(particles[j].x, particles[j].y);
          ctx.strokeStyle = `rgba(47,129,247,${0.1 * (1 - d/80)})`;
          ctx.stroke();
        }
      }
    }

    // 时间(时分秒.毫秒 统一样式,等宽字体防晃动);毫秒直接取 nowMs,不走 Date
    const ms = String(Math.floor(t % 1000)).padStart(3, '0');
    const timeStr = `${parts.hour}:${parts.minute}:${parts.second}.${ms}`;
    ctx.textAlign = 'center';
    ctx.fillStyle = '#f0f6fc';
    ctx.font = '700 110px ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace';
    ctx.fillText(timeStr, W / 2, 172);

    // 日期
    ctx.textAlign = 'center';
    ctx.fillStyle = '#8b949e';
    ctx.font = '400 22px -apple-system, sans-serif';
    ctx.fillText(`${parts.year}-${parts.month}-${parts.day} ${parts.weekday}`, W/2, 42);

    // 校准状态角标(右上)
    ctx.font = '400 17px -apple-system, sans-serif';
    ctx.textAlign = 'right';
    if (calibrated && quality === 'coarse') {
      ctx.fillStyle = '#d29922';
      ctx.fillText('⚠ 粗对时', W - 36, 42);
    } else if (calibrated) {
      ctx.fillStyle = '#3fb950';
      ctx.fillText('✓ 已对时', W - 36, 42);
    } else if (offsetMs !== 0) {
      ctx.fillStyle = '#d29922';
      ctx.fillText('⏳ 沿用上次校准', W - 36, 42);
    } else {
      ctx.fillStyle = '#f85149';
      ctx.fillText('⚠ 本地时间', W - 36, 42);
    }
  }

  // 流 + PiP
  video.srcObject = canvas.captureStream(30); // 30fps 视频流,毫秒更新顺滑
  video.play().catch(() => {});

  const pipSupported = 'pictureInPictureEnabled' in document && document.pictureInPictureEnabled;
  pipBtn.addEventListener('click', () => {
    if (document.pictureInPictureElement) return document.exitPictureInPicture();
    ('requestPictureInPicture' in video) ? video.requestPictureInPicture()
      : ('webkitSetPresentationMode' in video) ? video.webkitSetPresentationMode('picture-in-picture')
      : status.innerHTML = '⚠️ 浏览器不支持 PiP';
  });

  syncBtn.addEventListener('click', calibrate);
  video.addEventListener('enterpictureinpicture', () => status.innerHTML = '📌 已小窗!');
  video.addEventListener('leavepictureinpicture', () => status.innerHTML = '已退出小窗');

  // 只读调试钩子(自动化验收用,不影响 UI)
  window.__clock = {
    get state() { return { offsetMs, uncMs, calibrated, source: lastSource, samples: lastSamplesCount, quality, histLen: hist.length, rawOffset }; },
    get nowMs() { return nowMs(); },
    get draws() { return drawCount; },
    calibrate,
    async probeRaw(srcName) {
      const src = SOURCES.find(s => s.name === srcName);
      if (!src) throw new Error('unknown source: ' + srcName);
      const out = [];
      for (let i = 0; i < src.n; i++) {
        const s = await sample(src);
        if (s) out.push(s);
      }
      const a = aggregate(out, src.res);
      return a ? { est: a.est, u: a.u, n: a.n, minRtt: a.minRtt, offsets: a.offsets }
               : { est: NaN, u: Infinity, n: 0, minRtt: NaN, offsets: [] };
    }
  };

  async function init() {
    // 先跑帧循环:对时期间显示本地时间,角标和状态栏会说明精度
    setInterval(() => { if (document.hidden) draw(); }, 100);
    (function loop() { draw(); requestAnimationFrame(loop); })();
    await calibrate();
    setInterval(calibrate, CALIBRATE_MS);
    // 切回前台时,距上次校准 >60 秒就立即重校
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && performance.now() - lastCalAt > 60000) calibrate();
    });
  }
  init();
})();
</script>
</body>
</html>
